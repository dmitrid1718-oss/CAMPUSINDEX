name: Refresh Campus Index historical data
on:
  schedule:
    - cron: '41 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/update_history.py'
      - '.github/workflows/refresh-data.yml'
permissions:
  contents: write
concurrency:
  group: campus-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh sourced series with retry and validation
        run: python tools/update_history.py
      - name: Commit only actual changes
        run: |
          if git diff --quiet -- data/history.json; then
            echo 'No new or revised observations'
            exit 0
          fi
          git config user.name 'campus-index-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git commit -m 'data: refresh official historical series'
          git push
